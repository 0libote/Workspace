name: Desktop packages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-14
            target: macos-arm64
          - runner: windows-2025
            target: win-x64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2

      - run: bun install --frozen-lockfile --ignore-scripts

      - name: Prepare Electrobun SDK
        run: bunx electrobun@2.0.1 sync
        working-directory: apps/desktop

      - name: Build desktop package and installer
        run: bun run desktop:build

      - name: Upload desktop package and installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: astryx-desktop-${{ matrix.target }}-${{ github.sha }}
          path: apps/desktop/artifacts/*
          if-no-files-found: error
          retention-days: 14
